const BASE = "https://rapjr10.github.io/drunk-pepe/images";
const grid = document.getElementById('grid');
const meta = document.getElementById('meta');
const batchSel = document.getElementById('batch');
for (let i=1;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent='Batch '+i;batchSel.appendChild(o);}
let tier='All', batch=0, q='';
let shown=[];
function render(){
  shown = DATA.filter(d => (tier==='All'||d.t===tier) && (batch===0||d.bt===batch) && (q===''||d.id===+q));
  meta.textContent = 'Menampilkan ' + shown.length + ' dari 1,000';
  grid.innerHTML = shown.map(d =>
    '<div class="tile" onclick="openLb('+d.id+')">' +
    '<img loading="lazy" src="'+BASE+'/'+d.id+'.png" alt="Drunk Pepe #'+d.id+'">' +
    '<div class="cap"><b>#'+d.id+'</b><span class="badge t-'+d.t+'">'+d.t+'</span><br>' +
    '<span class="det">'+d.b+' · '+(d.a==='None'?'no acc':d.a)+' · B'+d.bt+'</span><br>'+esc(d.n)+'</div></div>'
  ).join('');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let cur=0;
function openLb(id){
  cur = shown.findIndex(d=>d.id===id); if(cur<0) cur=0;
  showLb();
}
function showLb(){
  const d = shown[cur]; if(!d) return;
  document.getElementById('lbImg').src = BASE+'/'+d.id+'.png';
  document.getElementById('lbInfo').innerHTML = '<b>#'+d.id+' — '+esc(d.n)+'</b><br>Tier: '+d.t+' · Background: '+d.b+' · Accessory: '+d.a+' · Batch '+d.bt;
  document.getElementById('lb').classList.add('open');
}
function closeLb(){document.getElementById('lb').classList.remove('open');}
function stepLb(dir){cur=(cur+dir+shown.length)%shown.length;showLb();}
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('button[data-t]'); if(!b) return;
  tier=b.dataset.t;
  document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
batchSel.addEventListener('change',()=>{batch=+batchSel.value;render();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();render();});
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
render();
</script>
